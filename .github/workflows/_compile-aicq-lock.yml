name: Compile AICQ Agentic Workflow Lock

on:
  push:
    paths:
      - '.github/workflows/_compile-aicq-lock.yml'
      - '.github/workflows/aicq-autonomous-audit.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitHub Agentic Workflows CLI
        run: |
          curl -sL https://raw.githubusercontent.com/github/gh-aw/v0.88.7/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions/gh-aw" >> "$GITHUB_PATH"

      - name: Compile AAA workflow
        run: gh aw compile .github/workflows/aicq-autonomous-audit.md

      - name: Export compiled lock
        run: cp .github/workflows/aicq-autonomous-audit.lock.yml compiled-aicq-autonomous-audit.lock.yml

      - name: Commit exported lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/aicq-autonomous-audit.lock.yml compiled-aicq-autonomous-audit.lock.yml
          if git diff --cached --quiet; then
            echo 'Compiled lock is already current.'
            exit 0
          fi
          git commit -m 'chore: export compiled AAA lock'
          git push
