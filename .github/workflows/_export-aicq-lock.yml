name: Export AICQ Compiled Lock

on:
  push:
    paths:
      - '.github/workflows/_export-aicq-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: |
          curl -sL https://raw.githubusercontent.com/github/gh-aw/v0.88.7/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions/gh-aw" >> "$GITHUB_PATH"
      - name: Compile
        run: gh aw compile .github/workflows/aicq-autonomous-audit.md
      - name: Commit generated lock with elevated token
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
        run: |
          gh auth setup-git
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f .github/workflows/aicq-autonomous-audit.lock.yml
          git commit -m 'chore: compile AAA workflow lock'
          git push origin HEAD:main
