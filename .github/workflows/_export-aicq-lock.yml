name: Export AICQ Compiled Lock

on:
  push:
    paths:
      - '.github/workflows/_export-aicq-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gh-aw
        run: |
          curl -sL https://raw.githubusercontent.com/github/gh-aw/v0.88.7/install-gh-aw.sh | bash
          echo "$HOME/.local/share/gh/extensions/gh-aw" >> "$GITHUB_PATH"
      - name: Compile
        run: gh aw compile .github/workflows/aicq-autonomous-audit.md
      - name: Export compiled lock artifact
        run: cp .github/workflows/aicq-autonomous-audit.lock.yml /tmp/aicq-autonomous-audit.lock.yml
      - name: Upload compiled lock
        uses: actions/upload-artifact@v4
        with:
          name: aicq-compiled-lock
          path: /tmp/aicq-autonomous-audit.lock.yml
          if-no-files-found: error
